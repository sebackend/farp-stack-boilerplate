[project]
name = "api"
version = "0.1.0"
description = "FastAPI backend for the FARP task manager boilerplate"
requires-python = ">=3.13"
dependencies = [
  "alembic>=1.16",
  "argon2-cffi>=25.1",
  "asyncpg>=0.30",
  "email-validator>=2.2",
  "fastapi>=0.120",
  "pydantic>=2.11",
  "pydantic-settings>=2.10",
  "pyjwt>=2.10",
  "sqlalchemy[asyncio]>=2.0.40",
  "structlog>=25.4",
  "uvicorn[standard]>=0.35",
]

[dependency-groups]
dev = [
  "httpx>=0.28",
  "mypy>=1.17",
  "pytest>=8.4",
  "pytest-asyncio>=1.1",
  "pytest-cov>=6.2",
  "ruff>=0.12",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "ASYNC", "RUF"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI dependencies are declared as default arguments.
extend-immutable-calls = ["fastapi.Depends", "fastapi.Path", "fastapi.Query"]

[tool.mypy]
python_version = "3.13"
strict = true
plugins = ["pydantic.mypy"]
exclude = ["alembic/"]

[[tool.mypy.overrides]]
module = ["asyncpg"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
filterwarnings = ["error::DeprecationWarning:app.*"]

[tool.coverage.run]
source = ["app"]
# SQLAlchemy runs async code through greenlets; trace them or lines go missing.
concurrency = ["greenlet", "thread"]
